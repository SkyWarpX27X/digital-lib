name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch your code from the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up the Java Development Kit (JDK)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # 3. Authenticate and configure Gradle with automatic caching
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # 4. Make sure the wrapper script is executable (prevents permission denied errors)
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 5. Run compile, check style, and execute unit tests
    - name: Run Tests with Gradle Wrapper
      run: ./gradlew test
