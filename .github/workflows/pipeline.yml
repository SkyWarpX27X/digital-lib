name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch your code from the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up the Java Development Kit (JDK)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # 3. Authenticate and configure Gradle with automatic caching
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # 4. Make sure the wrapper script is executable (prevents permission denied errors)
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 5. Run compile, check style, and execute unit tests
    - name: Run Tests with Gradle Wrapper
      run: ./gradlew test

  newman-test:
    name: Test API endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Start app
        run: |
          ./gradlew bootRun &
           npx wait-on http://localhost:8080/actuator/health --timeout 60000
          

      - name: Run Newman
        run: npx newman run postman/collection.json -e postman/env.json