services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digital_lib
      POSTGRES_USER: digital_lib
      POSTGRES_PASSWORD: digital_lib
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: pgsty/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/digital-lib
      "
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  pgdata:
  miniodata:
