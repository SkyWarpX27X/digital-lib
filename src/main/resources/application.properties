spring.application.name=digital-lib
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
security.jwt.expiration-in-minutes=15
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=40MB

spring.cloud.aws.region.static=${AWS_REGION:eu-north-1}
spring.cloud.aws.credentials.profile.name=digitallib
spring.cloud.aws.s3.region=${AWS_REGION:eu-north-1}
app.storage.bucket=digital-lib-137726815245-eu-north-1-an
