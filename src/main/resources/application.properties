spring.application.name=digital-lib
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
security.jwt.expiration-in-minutes=15
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.probes.enabled=true
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=40MB
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoints.access.default=read-only
management.endpoint.loggers.access=unrestricted
management.health.mail.enabled=false

app.scheduling.storage-orphans.cron=0 30 1 * * *
app.scheduling.audit-retention.cron=0 0 2 * * *
app.scheduling.storage-integrity.cron=0 30 2 * * *
app.storage.orphan-min-age=24h
app.audit.retention=90d
app.scheduling.resource-monitor.cron=0 * * * * *
app.scheduling.log-level-reset.cron=0 * * * * *
app.scheduling.filter-options-refresh.cron=0 */5 * * * *
app.logging.level-reset-after=30m
