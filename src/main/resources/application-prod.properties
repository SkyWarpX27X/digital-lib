spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

security.jwt.secret=${JWT_SECRET}

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# S3 credentials come from the default AWS chain (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY or an IAM role)
spring.cloud.aws.region.static=${AWS_REGION}
app.storage.bucket=${S3_BUCKET}
