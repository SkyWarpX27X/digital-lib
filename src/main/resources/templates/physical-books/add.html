<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Додати фізичну книгу')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('physical-books')}"></aside>

    <main class="content content--narrow">
        <h1 class="page-title">Додати фізичну книгу</h1>

        <form class="card" th:action="@{/physical-books}" th:object="${form}" method="post" novalidate>
            <div class="form-card__body">
                <label class="field__label" for="name">Назва</label>
                <input class="input" type="text" id="name" th:field="*{name}" th:errorclass="input--invalid">
                <span class="field__error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

                <label class="field__label" for="authors">Автори</label>
                <input class="input" type="text" id="authors" th:field="*{authors}" th:errorclass="input--invalid">
                <span class="field__error" th:if="${#fields.hasErrors('authors')}" th:errors="*{authors}"></span>
                <p class="field__hint">Якщо авторів кілька, перелічіть їх через кому.</p>

                <label class="field__label" for="description">Опис</label>
                <textarea class="input input--textarea" id="description" th:field="*{description}" rows="6" th:errorclass="input--invalid"></textarea>
                <span class="field__error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>

                <label class="field__label" for="topic">Тема</label>
                <input class="input" type="text" id="topic" th:field="*{topic}" th:errorclass="input--invalid">
                <span class="field__error" th:if="${#fields.hasErrors('topic')}" th:errors="*{topic}"></span>

                <label class="field__label" for="publishingYear">Рік публікації</label>
                <input class="input" type="text" id="publishingYear" inputmode="numeric" th:field="*{publishingYear}" th:errorclass="input--invalid">
                <span class="field__error" th:if="${#fields.hasErrors('publishingYear')}" th:errors="*{publishingYear}"></span>

                <label class="field__label" for="language">Мова</label>
                <input class="input" type="text" id="language" th:field="*{language}" th:errorclass="input--invalid">
                <span class="field__error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></span>

                <label class="field__label" for="resourceType">Вид</label>
                <input class="input" type="text" id="resourceType" th:field="*{resourceType}" th:errorclass="input--invalid">
                <span class="field__error" th:if="${#fields.hasErrors('resourceType')}" th:errors="*{resourceType}"></span>
            </div>

            <div>
                <a class="btn btn--secondary" th:href="@{/physical-books}">Скасувати</a>
                <button class="btn btn--primary" type="submit">Зберегти</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
