<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Фізичні книги')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('physical-books')}"></aside>
    <main class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Фізичні книги</h1>
            </div>
            <a class="btn btn--primary" th:href="@{/physical-books/new}" sec:authorize="hasAnyRole('BOOK_DELIVERY_DEPARTMENT', 'ADMIN')">Додати фізичну книгу</a>
        </div>
        <div class="alert alert--success" th:if="${message}" th:text="${message}" role="status"></div>
        <div class="card">
            <table class="table">
                <thead>
                <tr>
                    <th>Назва</th>
                    <th>Автори</th>
                    <th>Тема</th>
                    <th>Рік публікації</th>
                    <th>Мова</th>
                    <th>Вид</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td class="table__primary" th:text="${book.name()}"></td>
                    <td th:text="${#strings.listJoin(book.authors(), ', ')}"></td>
                    <td th:text="${book.topic()}"></td>
                    <td th:text="${book.publishingYear()}"></td>
                    <td th:text="${book.language()}"></td>
                    <td th:text="${book.resourceType()}"></td>
                </tr>
                <tr class="table__empty" th:if="${#lists.isEmpty(books)}">
                    <td colspan="6">Книги відсутні</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
