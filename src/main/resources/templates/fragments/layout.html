<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Електронна бібліотека</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="brand" th:fragment="brand">
    <div class="brand__logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
    </div>
    <div>
        <div class="brand__title">Електронна бібліотека</div>
        <div>ім. Л. Подерв'янського</div>
    </div>
</header>

<aside class="sidebar" th:fragment="sidebar(active)">
    <div th:replace="~{fragments/layout :: brand}"></div>

    <nav class="nav">
        <a class="nav__link" th:href="@{/digitized-books}" th:classappend="${active == 'digitized-books'} ? 'nav__link--active'">Оцифровані книги</a>
        <a class="nav__link" th:href="@{/physical-books}" th:classappend="${active == 'physical-books'} ? 'nav__link--active'">Фізичні книги</a>
        <a class="nav__link" sec:authorize="hasRole('READER')" th:href="@{/book-orders}" th:classappend="${active == 'book-orders'} ? 'nav__link--active'">Замовлення</a>
        <a class="nav__link" sec:authorize="hasRole('ADMIN')" th:href="@{/users}" th:classappend="${active == 'users'} ? 'nav__link--active'">Користувачі</a>
        <a class="nav__link" sec:authorize="hasRole('ADMIN')" th:href="@{/library-cards}" th:classappend="${active == 'library-cards'} ? 'nav__link--active'">Картки читачів</a>
    </nav>

    <div class="sidebar__user" sec:authorize="isAuthenticated()">
        <div>
            <div class="sidebar__user-name" sec:authentication="principal.name">Ім'я</div>
            <div class="sidebar__user-role" sec:authentication="principal.username">логін</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="icon-btn" type="submit">Вийти</button>
        </form>
    </div>
</aside>

</body>
</html>
