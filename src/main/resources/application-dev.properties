spring.datasource.url=jdbc:postgresql://localhost:5432/digital_lib
spring.datasource.username=digital_lib
spring.datasource.password=digital_lib

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.ua.fictionallibrary=INFO

spring.web.error.include-message=always
spring.web.error.include-stacktrace=on_param
spring.web.error.include-binding-errors=always

management.endpoints.web.exposure.include=*

app.cors.allowed-origins=http://localhost:3000

security.jwt.secret=random-long-key-at-least-256-bits-long-very-long-very-random

spring.cloud.aws.s3.endpoint=http://localhost:9000
spring.cloud.aws.s3.path-style-access-enabled=true
spring.cloud.aws.credentials.access-key=minioadmin
spring.cloud.aws.credentials.secret-key=minioadmin
spring.cloud.aws.region.static=us-east-1
app.storage.bucket=digital-lib

spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=noreply@digital-lib.local
app.base-url=http://localhost:3000
