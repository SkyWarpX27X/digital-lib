spring.datasource.url=jdbc:postgresql://localhost:5432/digital_lib
spring.datasource.username=digital_lib
spring.datasource.password=digital_lib

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.ua.fictionallibrary=DEBUG

spring.web.error.include-message=always
spring.web.error.include-stacktrace=on_param
spring.web.error.include-binding-errors=always

management.endpoints.web.exposure.include=*

security.jwt.secret=random-long-key-at-least-256-bits-long-very-long-very-random
